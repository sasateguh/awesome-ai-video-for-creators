# Teks BERSAMA setiap senarai berpangkat (gilap `senarai`, PELAN-senarai-niche §2.1). EN = README.md, BM = README.ms.md.
# Ayat di sini = teks awam: ubah = FLAG kepada pemilik (S3/S6/S9) sebelum terbit. Kod hanya mengisi slot {..} dengan FAKTA.
# Teks khusus satu senarai (tajuk, ayat pembuka, nama kategori) hidup dalam config/senarai/<id>.toml.
# Tiada bahagian lesen dalam README (awesome-lint `awesome-license`): lesen = fail LICENSE repo senarai (CC0-1.0).
# Penerangan setiap entri = penerangan GitHub repo itu SENDIRI (dipetik); `titik` ditambah hanya bila ia tiada tanda akhir.
# `sumbang_fail` EN + BM = SATU contributing.md (EN dahulu); slot {bintang_min} {hari} = ambang config.

[en]
fail = "README.md"
lencana = "[![Awesome](https://awesome.re/badge.svg)](https://awesome.re)"
pautan_bahasa = "**English** · [Bahasa Melayu](README.ms.md)"
kandungan = "Contents"
entri = "- [{nama}]({url}) - {fakta} — {penerangan}"
fakta = "★ {bintang} · {lesen} · {aktif}"
titik = "."
tiada_lesen = "no license"
lesen_lain = "other license"
produk = "**From the maintainers:** {teks} To work with us, see Work with Sasa Teguh below. It is not ranked in this list."
produk_lalai = "Sasa Teguh makes [{nama}]({url})."
kad_tajuk = "Work with Sasa Teguh"
kad = """[![Work with Sasa Teguh: book a call](https://raw.githubusercontent.com/sasateguh/.github/main/assets/work-with-sasa-teguh.png)](https://sasateguh.com/book)

This list is maintained by [Sasa Teguh](https://sasateguh.com), a studio in Malaysia. We build websites that are found on Google and in AI answers, and we set up systems for businesses.

hello@sasateguh.com · [More from Sasa Teguh](https://github.com/sasateguh)"""
cara_tajuk = "How the ranking works"
cara = """Every entry is a public GitHub repository. Each week a script reads its stars, last push and license from the GitHub API and sorts each category by

`score = {w_bintang} × log10(1 + stars) + {w_aktif} × max(0, 1 − days since last push ÷ {hari})`

A repository is left out when it is archived, a fork, has no description, has fewer than {bintang_min} stars or has not been pushed for {hari} days. Star counts are rounded down to the nearest {bundar}. Descriptions are the repositories' own GitHub descriptions."""
sumbang_tajuk = "Contributing"
sumbang = "Suggestions are welcome. See [contributing.md](contributing.md)."
sumbang_fail = """# Contributing

This list is generated by a script from public GitHub data and refreshed every week. To suggest a repository, open an issue with its link.

A suggestion is added when the repository fits a category of this list, has a description, has at least {bintang_min} stars and has been pushed in the last {hari} days. The ranking is never changed by hand, and descriptions are the repositories' own GitHub descriptions."""

[ms]
fail = "README.ms.md"
lencana = "[![Awesome](https://awesome.re/badge.svg)](https://awesome.re)"
pautan_bahasa = "[English](README.md) · **Bahasa Melayu**"
kandungan = "Kandungan"
entri = "- [{nama}]({url}) - {fakta} — {penerangan}"
fakta = "★ {bintang} · {lesen} · {aktif}"
titik = "."
tiada_lesen = "tiada lesen"
lesen_lain = "lesen lain"
produk = "**Daripada penyelenggara:** {teks} Untuk bekerja dengan kami, lihat Bekerja dengan Sasa Teguh di bawah. Ia tidak dipangkat dalam senarai ini."
produk_lalai = "Sasa Teguh membuat [{nama}]({url})."
kad_tajuk = "Bekerja dengan Sasa Teguh"
kad = """[![Bekerja dengan Sasa Teguh: tempah panggilan](https://raw.githubusercontent.com/sasateguh/.github/main/assets/work-with-sasa-teguh.png)](https://sasateguh.com/ms/book)

Senarai ini diselenggara oleh [Sasa Teguh](https://sasateguh.com/ms), studio di Malaysia. Kami membina laman web yang ditemui di Google dan dalam jawapan AI, dan memasang sistem untuk perniagaan.

hello@sasateguh.com · [Lagi daripada Sasa Teguh](https://github.com/sasateguh)"""
cara_tajuk = "Cara pangkat dikira"
cara = """Setiap entri ialah repositori GitHub awam. Setiap minggu satu skrip membaca bintang, tolakan terakhir dan lesennya daripada API GitHub, kemudian menyusun setiap kategori mengikut

`skor = {w_bintang} × log10(1 + bintang) + {w_aktif} × max(0, 1 − hari sejak tolakan terakhir ÷ {hari})`

Repositori tidak disenaraikan bila ia diarkib, fork, tiada penerangan, kurang daripada {bintang_min} bintang atau tiada tolakan selama {hari} hari. Bilangan bintang dibundarkan ke bawah kepada gandaan {bundar} terdekat. Penerangan ialah penerangan GitHub repositori itu sendiri."""
sumbang_tajuk = "Menyumbang"
sumbang = "Cadangan dialu-alukan. Lihat [contributing.md](contributing.md)."
sumbang_fail = """## Bahasa Melayu

Senarai ini dijana oleh skrip daripada data awam GitHub dan dikemas setiap minggu. Untuk mencadangkan repositori, buka isu dengan pautannya.

Cadangan ditambah bila repositori itu sesuai dengan kategori senarai ini, ada penerangan, sekurang-kurangnya {bintang_min} bintang dan ada tolakan dalam {hari} hari terakhir. Pangkat tidak pernah diubah dengan tangan, dan penerangan ialah penerangan GitHub repositori itu sendiri."""
