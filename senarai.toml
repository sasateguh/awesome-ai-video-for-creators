[en]
tajuk = "Awesome AI Video for Creators"
pembuka = "Open-source tools that edit and produce short videos with AI: captions, clipping, silence removal, reframing, dubbing and programmatic video. Ranked by stars and recent activity, refreshed every week."

[ms]
tajuk = "Senarai Berpangkat Video AI Pencipta Kandungan"
pembuka = "Alat sumber terbuka yang menyunting dan menghasilkan video pendek dengan AI: sari kata, potongan klip, buang senyap, bingkai semula, alih suara dan video berprogram. Dipangkat ikut bintang dan aktiviti terkini, dikemas setiap minggu."

[github]
# Deskripsi + topik (DRAF, perlu kelulusan pemilik). Topik: `gilap topik --wajib awesome,awesome-list` 25 Okt + pertimbangan
# makna: whisper (pembaca ASR/mesyuarat), motion-graphics (alat reka bentuk) dan creator-tools (bercampur) ditolak walaupun ramai.
penerangan = "Ranked, weekly-updated list of open-source AI tools that edit and produce short videos: captions, clipping, silence removal, dubbing and programmatic video."
topik = ["awesome", "awesome-list", "video-editing", "ai-video", "subtitles", "tiktok", "content-creation", "video-editor", "remotion", "youtube-shorts", "reels", "dubbing"]

